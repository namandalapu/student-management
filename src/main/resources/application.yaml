spring:
  application:
    name: student-management

  # Embedded H2 database (file-based so data survives restarts)
  datasource:
    url: jdbc:h2:file:./data/studentdb;AUTO_SERVER=TRUE
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  # The Angular UI (src/main/web) is built into classpath:/static and served by WebConfig,
  # which also routes client-side URLs to index.html. Turn off Boot's default static mapping.
  web:
    resources:
      add-mappings: false

server:
  port: 8080

app:
  cors:
    # Allowed origin for the Angular dev server (only used when running ng serve on its own)
    allowed-origins: http://localhost:4200
  seed:
    # Load sample students and courses on first start when the database is empty
    enabled: true
  client:
    # Where StudentManagementClient (the RestTemplate-based API client) sends requests
    base-url: http://localhost:${server.port}
